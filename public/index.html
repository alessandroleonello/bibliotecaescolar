<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Escolar — Sistema Integrado de Gestão</title>
  <meta name="description" content="Sistema de gestão de biblioteca escolar multi-escola: acervo, circulação de empréstimos, devoluções e catálogo público." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>

  <!-- Main Application Shell -->
  <div class="app-layout">
    
    <!-- Collapsible Sidebar -->
    <aside class="app-sidebar" id="app-sidebar" style="display: none;">
      <div class="sidebar-header">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-0.5-.05"/>
            <path d="M6 2v20"/>
            <path d="M10 7h6"/>
            <path d="M10 11h6"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">BiblioEscolar</div>
          <div class="brand-subtitle">Gestão de Acervo</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav-list">
        <!-- Injected dynamically by role in main.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-snippet">
          <div class="user-avatar" id="sidebar-user-avatar">U</div>
          <div class="user-info">
            <div class="user-name" id="sidebar-user-name">Usuário</div>
            <div class="user-role" id="sidebar-user-role">Acesso</div>
          </div>
        </div>
        <button id="btn-logout" class="btn-icon" title="Sair da conta" aria-label="Sair da conta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="app-main" id="main-wrapper">
      
      <!-- Top Sticky Header -->
      <header class="app-header" id="app-header" style="display: none;">
        <div class="page-heading">
          <button id="menu-toggle" class="btn-icon menu-toggle" aria-label="Abrir menu lateral">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title" id="header-page-title">Biblioteca</h1>
          <span class="school-tag" id="header-school-tag">Escola Ativa</span>
        </div>

        <div class="header-actions">
          <a href="tutorial.html" target="_blank" class="btn btn-sm btn-secondary" title="Abrir Tutorial e Guia de Implantação da Escola" style="display: inline-flex; align-items: center; gap: 0.4rem;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>Guia & Tutorial</span>
          </a>
          <a href="catalogo.html" target="_blank" class="btn btn-sm btn-ghost" title="Visualizar catálogo público do aluno">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>Ver Catálogo do Aluno</span>
          </a>
        </div>
      </header>

      <!-- Dynamic Outlet for Current Page -->
      <main class="page-content" id="page-content" role="main">
        <!-- Pages rendered here -->
      </main>

    </div>

  </div>

  <!-- Global Modal & Toast Container Roots -->
  <div id="modal-overlay" class="modal-overlay"></div>
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Entry Point (ES Module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
