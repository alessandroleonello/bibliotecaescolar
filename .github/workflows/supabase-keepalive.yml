name: Supabase Database Keep-Alive (Prevenção de Pausa de 7 Dias)

on:
  schedule:
    # Executa todos os dias às 06:00 e 18:00 UTC (100% gratuito e automático no GitHub Actions)
    - cron: '0 6,18 * * *'
  workflow_dispatch: # Permite disparar manualmente a qualquer momento pelo GitHub

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database Heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bijrbjttgslqbqioiggo.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpanJianR0Z3NscWJxaW9pZ2dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NDY4NjUsImV4cCI6MjEwNzMyMjg2NX0.5vcKM3i4HzpOcDcvI-2mcFXpoIN7ZUt3g3_-xFFx1tY' }}
        run: |
          echo "Enviando ping de atividade para manter o banco Supabase acordado..."
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # 1. Atualiza registro na tabela heartbeat via PATCH com timestamp válido
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH "${SUPABASE_URL}/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\":\"${TIMESTAMP}\"}")
            
          echo "Status do PATCH no Heartbeat: $HTTP_CODE"
          
          # 2. Faz uma leitura real no banco de dados para garantir atividade do PostgreSQL
          GET_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SUPABASE_URL}/rest/v1/schools?select=id,name&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            
          echo "Status do SELECT no Banco: $GET_CODE"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Ping registrado com sucesso no banco de dados! Projeto Supabase mantido ativo."
          else
            echo "Aviso: O PATCH retornou código $HTTP_CODE. Resposta: $(cat /tmp/resp.json 2>/dev/null)"
            # Se o SELECT respondeu com sucesso, o banco está ativo
            if [ "$GET_CODE" -ge 200 ] && [ "$GET_CODE" -lt 300 ]; then
              echo "Consulta SELECT bem-sucedida. Banco ativo."
            else
              echo "Falha ao comunicar com o banco de dados Supabase."
              exit 1
            fi
          fi

